<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravan layout preview</title>
<style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden}#game{position:relative}#preview{position:absolute;z-index:90;left:8px;top:72px;padding:6px;background:#12231ee8;border-radius:6px;color:white;font:12px system-ui}#preview select{font:inherit;max-width:110px}#preview button{font:inherit}</style>
<div id="game"></div><div id="preview"><label>Crew <select id="crew"><option value="0">Starter</option><option value="1">Merchant</option><option value="2">Forge</option><option value="3">Full crew</option></select></label> <label>Biome <select id="biome"><option value="plains">Plains</option><option value="forest">Forest</option><option value="snow">Snow</option><option value="dungeon">Dungeon</option></select></label></div>
<script type="module">
import {createCaravan} from '/src/caravan.ts';
import {defaultMeta} from '/src/meta.ts';
import {biomeDef} from '/src/camp.ts';
if(!import.meta.env.DEV) throw new Error('Development preview only');
const meta=defaultMeta(); Object.assign(meta,{wood:60,ore:60,treasure:20});
let hub;
const show=()=>{hub?.destroy();hub=createCaravan(meta,biomeDef(meta.biome),{
  forge:()=>{meta.blacksmithHired=true;hub.refresh()},
  magic:()=>{if(meta.biome!=='plains'){meta.wizardHired=true;hub.refresh()}else hub.announce('Recruit Aldwin in the forest.')},
  shop:()=>hub.announce('Shop clicked'),quests:()=>hub.announce('Quest guide clicked'),
  menu:()=>hub.announce('Menu clicked'),start:()=>{hub.root.classList.add('is-departing');setTimeout(()=>hub.root.classList.remove('is-departing'),900)}
});};
document.querySelector('#crew').addEventListener('change',e=>{const n=Number(e.target.value);Object.assign(meta,{peddlerArrived:n>=1,blacksmithHired:n>=2,wizardHired:n>=3});hub.refresh()});
document.querySelector('#biome').addEventListener('change',e=>{meta.biome=e.target.value;show()});
show();
</script></html>
